<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feynman Check — Login</title>
  <meta name="description" content="Feynman Check: AI-powered Socratic revision for OOP concepts. Login as a Student or Instructor.">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* ── Role Selector ── */
    .role-tabs {
      display: flex;
      gap: 0;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .role-tab {
      flex: 1;
      padding: 10px 0;
      font-size: 0.88rem;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.25s ease;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: 0.02em;
    }
    .role-tab.active-student {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 12px var(--accent-glow);
    }
    .role-tab.active-instructor {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      box-shadow: 0 2px 12px rgba(239,68,68,0.4);
    }
    .role-tab:hover:not(.active-student):not(.active-instructor) {
      color: var(--text-primary);
      background: rgba(255,255,255,0.06);
    }

    /* ── Form panels ── */
    .form-panel {
      display: none;
      animation: fadeSlideIn 0.3s ease;
    }
    .form-panel.active {
      display: block;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Instructor badge ── */
    .instructor-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(239,68,68,0.12);
      color: #ef4444;
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 18px;
    }

    /* ── Override login-card subtitle per context ── */
    .subtitle-student { color: var(--text-muted); }
    .subtitle-instructor { color: rgba(239,68,68,0.7); }

    /* ── Demo links grid ── */
    .demo-hint {
      margin-top: 24px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      text-align: left;
    }
    .demo-hint-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
    }
    .demo-link {
      font-size: 0.82rem;
      color: var(--accent-light);
      text-decoration: none;
      padding: 4px 6px;
      border-radius: 5px;
      transition: background 0.15s;
    }
    .demo-link:hover {
      background: rgba(99,102,241,0.12);
    }

    /* ── PIN input styling ── */
    #pin {
      letter-spacing: 0.2em;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-card">

      <!-- Header -->
      <div class="logo">🧠</div>
      <h1>Feynman Check</h1>
      <p class="subtitle" id="page-subtitle">Socratic Revision for OOP Concepts</p>

      <!-- Role selector tabs -->
      <div class="role-tabs" role="tablist" aria-label="Login role selection">
        <button
          class="role-tab active-student"
          id="tab-student"
          role="tab"
          aria-selected="true"
          aria-controls="panel-student"
          onclick="switchRole('student')"
        >
          🎓 Student
        </button>
        <button
          class="role-tab"
          id="tab-instructor"
          role="tab"
          aria-selected="false"
          aria-controls="panel-instructor"
          onclick="switchRole('instructor')"
        >
          🔐 Instructor
        </button>
      </div>

      <!-- ═══ STUDENT PANEL ═══ -->
      <div class="form-panel active" id="panel-student" role="tabpanel" aria-labelledby="tab-student">

        <!-- ERROR_MSG_STUDENT -->

        <form method="post" action="/login" id="student-login-form">
          <div class="form-group">
            <label for="roll_number">Roll Number</label>
            <input
              type="text"
              id="roll_number"
              name="roll_number"
              placeholder="e.g. 2023101001"
              autofocus
              required
            >
          </div>
          <button type="submit" class="btn-primary" id="student-login-btn">
            Start Revision →
          </button>
        </form>

        <div class="demo-hint">
          <div class="demo-hint-title">Demo Students (click to autofill)</div>
          <div class="demo-grid">
            <a href="#" class="demo-link" onclick="autofill('2023101001');return false;">2023101001 — Alice</a>
            <a href="#" class="demo-link" onclick="autofill('2023101002');return false;">2023101002 — Bob</a>
            <a href="#" class="demo-link" onclick="autofill('2023101003');return false;">2023101003 — Charlie</a>
            <a href="#" class="demo-link" onclick="autofill('2023101004');return false;">2023101004 — Diana</a>
            <a href="#" class="demo-link" onclick="autofill('2023101005');return false;">2023101005 — Eve</a>
            <a href="#" class="demo-link" onclick="autofill('2023101006');return false;">2023101006 — Frank</a>
          </div>
        </div>
      </div>

      <!-- ═══ INSTRUCTOR PANEL ═══ -->
      <div class="form-panel" id="panel-instructor" role="tabpanel" aria-labelledby="tab-instructor">

        <div style="text-align:center; margin-bottom: 16px;">
          <span class="instructor-badge">🔒 Restricted — Staff Only</span>
        </div>

        <!-- ERROR_MSG_INSTRUCTOR -->

        <form method="post" action="/instructor/login" id="instructor-login-form">
          <div class="form-group">
            <label for="pin">Access PIN</label>
            <input
              type="password"
              id="pin"
              name="pin"
              placeholder="Enter instructor PIN"
              autocomplete="current-password"
              required
            >
          </div>
          <button type="submit" class="btn-primary" id="instructor-login-btn"
            style="background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 4px 16px rgba(239,68,68,0.35);">
            Access Dashboard →
          </button>
        </form>

        <p style="text-align:center; margin-top:18px; font-size:0.8rem; color:var(--text-muted);">
          Contact your system admin if you've forgotten your PIN.
        </p>
      </div>

    </div>
  </div>

  <script>
    // ── Role switcher ──
    function switchRole(role) {
      const panels   = { student: 'panel-student',    instructor: 'panel-instructor' };
      const tabs     = { student: 'tab-student',      instructor: 'tab-instructor' };
      const subtitles = {
        student:    'Socratic Revision for OOP Concepts',
        instructor: 'Monitoring & Analytics Dashboard'
      };
      const activeClass = { student: 'active-student', instructor: 'active-instructor' };

      // Panels
      document.getElementById('panel-student').classList.remove('active');
      document.getElementById('panel-instructor').classList.remove('active');
      document.getElementById(panels[role]).classList.add('active');

      // Tabs
      const tabStudent    = document.getElementById('tab-student');
      const tabInstructor = document.getElementById('tab-instructor');
      tabStudent.classList.remove('active-student', 'active-instructor');
      tabInstructor.classList.remove('active-student', 'active-instructor');
      tabStudent.setAttribute('aria-selected', role === 'student' ? 'true' : 'false');
      tabInstructor.setAttribute('aria-selected', role === 'instructor' ? 'true' : 'false');
      document.getElementById(tabs[role]).classList.add(activeClass[role]);

      // Subtitle
      document.getElementById('page-subtitle').textContent = subtitles[role];

      // Focus the first input of the active panel
      const activePanel = document.getElementById(panels[role]);
      const firstInput = activePanel.querySelector('input');
      if (firstInput) setTimeout(() => firstInput.focus(), 50);
    }

    // ── Demo student autofill ──
    function autofill(roll) {
      document.getElementById('roll_number').value = roll;
      document.getElementById('student-login-btn').focus();
    }

    // ── If page loaded with an instructor error, switch to instructor tab automatically ──
    window.addEventListener('DOMContentLoaded', () => {
      const hasInstructorError = document.querySelector('#panel-instructor .error');
      if (hasInstructorError) switchRole('instructor');
    });
  </script>
</body>

</html>
