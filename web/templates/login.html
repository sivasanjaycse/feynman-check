<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feynman Check — Academic Revision Workspace</title>
  <meta name="description" content="Feynman Check: Socratic revision workstation for Computer Science concepts.">
  <link rel="stylesheet" href="/static/style.css?v=2.3">
  <script>
    (function() {
      const saved = localStorage.getItem("fc_theme");
      if (saved === "light" || (!saved && window.matchMedia("(prefers-color-scheme: light)").matches)) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <script src="/static/theme.js" defer></script>
</head>

<body>
  <div class="theme-toggle-fixed">
    <button class="theme-toggle-btn" onclick="toggleTheme()" title="Switch Color Theme" aria-label="Toggle light/dark theme">
      <span class="theme-icon">☀️</span>
      <span class="theme-toggle-text">Light</span>
    </button>
  </div>

  <div class="login-container login-wrapper">
    <div class="login-card">

      <!-- Engineering Brand Header -->
      <div class="brand-header">
        <div class="brand-icon">FC</div>
        <div class="brand-title">
          <h1>Feynman Check</h1>
          <p id="page-subtitle">Socratic Revision Workspace &amp; Cohort Telemetry</p>
        </div>
      </div>

      <!-- Role Selector Tabs -->
      <div class="role-tabs" role="tablist" aria-label="Login role selection">
        <button
          class="role-tab active-student"
          id="tab-student"
          role="tab"
          aria-selected="true"
          aria-controls="panel-student"
          onclick="switchRole('student')"
        >
          Student Revision
        </button>
        <button
          class="role-tab"
          id="tab-instructor"
          role="tab"
          aria-selected="false"
          aria-controls="panel-instructor"
          onclick="switchRole('instructor')"
        >
          Faculty Portal
        </button>
      </div>

      <!-- Student Panel -->
      <div class="form-panel active" id="panel-student" role="tabpanel" aria-labelledby="tab-student">
        <!-- ERROR_MSG_STUDENT -->

        <form method="post" action="/login" id="student-login-form">
          <div class="form-group">
            <label for="roll_number">University Roll Number</label>
            <input
              type="text"
              id="roll_number"
              name="roll_number"
              placeholder="e.g. 2023101001"
              autofocus
              required
            >
          </div>
          <button type="submit" class="btn-primary" style="width: 100%;" id="student-login-btn">
            Enter Workspace &rarr;
          </button>
        </form>

        <div class="demo-roster-box">
          <div class="demo-roster-header">
            <span class="demo-roster-title">Demo Cohort (Click to Auto-fill)</span>
          </div>
          <div class="demo-roster-grid">
            <a href="#" class="demo-chip" onclick="autofill('2023101001');return false;">
              <span class="demo-chip-name">Alice</span>
              <span class="demo-chip-roll">2023101001</span>
            </a>
            <a href="#" class="demo-chip" onclick="autofill('2023101002');return false;">
              <span class="demo-chip-name">Bob</span>
              <span class="demo-chip-roll">2023101002</span>
            </a>
            <a href="#" class="demo-chip" onclick="autofill('2023101003');return false;">
              <span class="demo-chip-name">Charlie</span>
              <span class="demo-chip-roll">2023101003</span>
            </a>
            <a href="#" class="demo-chip" onclick="autofill('2023101004');return false;">
              <span class="demo-chip-name">Diana</span>
              <span class="demo-chip-roll">2023101004</span>
            </a>
            <a href="#" class="demo-chip" onclick="autofill('2023101005');return false;">
              <span class="demo-chip-name">Eve</span>
              <span class="demo-chip-roll">2023101005</span>
            </a>
            <a href="#" class="demo-chip" onclick="autofill('2023101006');return false;">
              <span class="demo-chip-name">Frank</span>
              <span class="demo-chip-roll">2023101006</span>
            </a>
          </div>
          <div class="demo-reset-action">
            <button type="button" class="btn-text-subtle" onclick="resetCohort()">
              &bull; Reset Cohort to Pre-seeded State (Alice &amp; Bob)
            </button>
          </div>
        </div>
      </div>

      <!-- Faculty / Instructor Panel -->
      <div class="form-panel" id="panel-instructor" role="tabpanel" aria-labelledby="tab-instructor">
        <div style="margin-bottom: 1rem;">
          <span class="badge badge-red">Course Staff Only</span>
        </div>

        <!-- ERROR_MSG_INSTRUCTOR -->

        <form method="post" action="/instructor/login" id="instructor-login-form">
          <div class="form-group">
            <label for="pin">Instructor Security PIN</label>
            <input
              type="password"
              id="pin"
              name="pin"
              placeholder="Enter PIN (demo: feynman2024)"
              autocomplete="current-password"
              required
            >
          </div>
          <button type="submit" class="btn-primary" style="width: 100%; background: #dc2626;" id="instructor-login-btn">
            Access Telemetry &rarr;
          </button>
        </form>

        <p style="margin-top: 1.2rem; font-size: 0.78rem; color: var(--text-muted); text-align: center;">
          Default demo PIN is configured as <code style="color:var(--text-secondary)">feynman2024</code>.
        </p>
      </div>

    </div>
  </div>

  <script>
    function switchRole(role) {
      const isStudent = role === 'student';
      document.getElementById('panel-student').classList.toggle('active', isStudent);
      document.getElementById('panel-instructor').classList.toggle('active', !isStudent);
      document.getElementById('tab-student').classList.toggle('active-student', isStudent);
      document.getElementById('tab-instructor').classList.toggle('active-instructor', !isStudent);

      const targetInput = isStudent ? document.getElementById('roll_number') : document.getElementById('pin');
      if (targetInput) targetInput.focus();
    }

    function autofill(roll) {
      const input = document.getElementById('roll_number');
      input.value = roll;
      input.focus();
    }

    async function resetCohort() {
      if (!confirm("Reset cohort telemetry to initial state (Alice & Bob pre-seeded)?")) return;
      try {
        const resp = await fetch("/api/reset-demo-cohort", { method: "POST" });
        const data = await resp.json();
        alert(data.message || "Cohort reset successfully!");
      } catch (err) {
        alert("Reset failed: " + err.message);
      }
    }
  </script>
</body>
</html>
