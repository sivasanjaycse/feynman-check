<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feynman Check — Course Catalog</title>
  <meta name="description" content="Select an Object-Oriented Programming lecture to begin Socratic concept revision.">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="dashboard-container">

    <!-- Top Navigation Bar -->
    <header class="top-navbar">
      <div class="nav-breadcrumbs">
        <span>CS3301 OOAD</span>
        <span>/</span>
        <strong>Course Revision Catalog</strong>
      </div>
      <div class="user-profile-badge">
        <div class="user-info">
          <div class="user-name">{{STUDENT_NAME}}</div>
          <div class="user-roll">Roll: {{STUDENT_ROLL}}</div>
        </div>
        <a href="/logout" class="btn-secondary" id="logout-btn">Log Out</a>
      </div>
    </header>

    <!-- Dashboard Hero -->
    <section class="dashboard-hero">
      <h2>Select a Lecture for Socratic Revision</h2>
      <p>Engage in a diagnostic dialogue to verify invariant understanding and surface potential mental fallacies.</p>
    </section>

    <!-- 7 OOP Lecture Cards Grid -->
    <main class="lecture-grid" id="lecture-grid">
      {{LECTURE_CARDS}}
    </main>

  </div>

  <script>
    async function refreshDashboardLectures() {
      try {
        const res = await fetch('/api/lectures');
        const lectures = await res.json();
        if (!Array.isArray(lectures) || lectures.length === 0) return;
        const grid = document.getElementById('lecture-grid');
        if (!grid) return;
        grid.innerHTML = lectures.map(lec => `
          <a href="/chat/${lec.id}" class="lecture-card" id="card-${lec.id}">
            <div class="lecture-meta-row">
              <span class="lecture-num">Lecture ${lec.num}</span>
              <span class="badge badge-blue">OOP Core</span>
            </div>
            <div class="lecture-title">${lec.title}</div>
            <div class="lecture-desc">${lec.desc || ''}</div>
            <div class="lecture-card-footer">
              <span class="action-link">Start Revision &rarr;</span>
            </div>
          </a>
        `).join('');
      } catch (e) {
        // Fallback to server rendered HTML
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        refreshDashboardLectures();
      }
    });
  </script>
</body>
</html>
