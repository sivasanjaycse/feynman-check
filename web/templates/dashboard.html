<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feynman Check — Dashboard</title>
  <meta name="description" content="Select a lecture to start your Socratic revision session">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
      <div>
        <h1>📚 OOP Revision</h1>
      </div>
      <div class="user-info">
        <span class="name">👋 {{STUDENT_NAME}} ({{STUDENT_ROLL}})</span>
        <a href="/logout" class="logout-btn" id="logout-btn">Logout</a>
      </div>
    </div>

    <p class="section-title">Choose a lecture to revise</p>

    <div class="lecture-grid">
      {{LECTURE_CARDS}}
    </div>
  </div>

  <script>
    async function refreshDashboardLectures() {
      try {
        const res = await fetch('/api/lectures');
        const lectures = await res.json();
        if (!Array.isArray(lectures) || lectures.length === 0) return;
        const grid = document.querySelector('.lecture-grid');
        if (!grid) return;
        grid.innerHTML = lectures.map(lec => `
          <a href="/chat/${lec.id}" class="lecture-card" id="card-${lec.id}">
            <div class="lecture-num">Lecture ${lec.num}</div>
            <div class="lecture-title">${lec.title}</div>
            <div class="lecture-desc">${lec.desc || ''}</div>
            <div class="lecture-action">Start Revision →</div>
          </a>
        `).join('');
      } catch (e) {
        // Fallback to server-rendered cards
      }
    }

    // Refresh when tab gains focus or on load
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        refreshDashboardLectures();
      }
    });
  </script>
</body>

</html>
